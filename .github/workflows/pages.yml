# Publishes dist/embed/ to GitHub Pages on every merge to main (ADR-0069).
# This is a deploy, not a check: tests still run in the local hooks (ADR-0006).
# Each build is added to the gh-pages branch as its own folder and old folders are kept, so the
# SRI hashes already pasted into Webflow keep matching. The whole branch is then deployed.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Runs third-party build code, so it gets a read-only token and no git credentials.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run check
      # Two paths keep their parent, so the artifact holds embed/ and 404.html side by side.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: embed
          path: |
            dist/embed/
            dist/404.html
          if-no-files-found: error
          retention-days: 1

  # Can push, so it installs nothing: only build/pages.js (Node built-ins) touches the files.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Keeps the token so the job can push gh-pages. The job uploads no artifacts, the usual way a
      # kept token leaks (zizmor artipacked).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: embed
          path: ${{ runner.temp }}/dist
      - name: Add this build to the gh-pages branch
        env:
          EMBED_DIR: ${{ runner.temp }}/dist/embed
          PAGE_FILE: ${{ runner.temp }}/dist/404.html
          SITE_DIR: ${{ runner.temp }}/site
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          base_url="https://${owner}.github.io/${GITHUB_REPOSITORY#*/}"
          if git fetch --depth=1 origin gh-pages; then
            git worktree add --detach "${SITE_DIR}" FETCH_HEAD
          else
            git worktree add --orphan -b gh-pages "${SITE_DIR}"
          fi
          node build/pages.js --embed "${EMBED_DIR}" --page "${PAGE_FILE}" \
            --site "${SITE_DIR}" --base "${base_url}"
          cd "${SITE_DIR}"
          git add -A
          if git diff --cached --quiet; then
            echo "gh-pages already has this build."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore(pages): publish build $(cat latest.txt) from ${GITHUB_SHA::7}"
          git push origin HEAD:refs/heads/gh-pages

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
